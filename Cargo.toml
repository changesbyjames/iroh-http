[workspace]
members = ["crates/iroh-http", "packages/browser/wasm"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "MIT OR Apache-2.0"
repository = "https://github.com/changesbyjames/iroh-http"

[workspace.dependencies]
bytes = "1.11"
http = "1.4"
http-body = "1.0"
http-body-util = "0.1"
iroh = { version = "=1.0.2", default-features = false }
iroh-tickets = "=1.0.0"
n0-future = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", default-features = false, features = ["sync"] }
tower = "0.5"

[profile.release]
codegen-units = 1
lto = true
