name: Publish release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  validate:
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@0.15.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check release tag and versions
        run: pnpm release:check "${RELEASE_TAG}"
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}

      - name: Run release gate
        run: pnpm ready

      # pnpm rewrites workspace dependencies when packing. npm publishes the
      # resulting tarballs directly so its CLI handles OIDC authentication.
      - name: Pack npm packages
        run: |
          mkdir -p "${RUNNER_TEMP}/npm-packages"
          for package in shared node browser; do
            pnpm --dir "packages/${package}" pack --out "${RUNNER_TEMP}/npm-packages/${package}.tgz"
          done

      - name: Upload npm packages
        uses: actions/upload-artifact@v4
        with:
          name: npm-packages
          path: ${{ runner.temp }}/npm-packages/*.tgz
          if-no-files-found: error

  npm:
    name: Publish npm packages
    needs: validate
    runs-on: ubuntu-latest
    environment: npm
    # npm trusted publishing uses OIDC; only this job may request a token.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install npm with trusted publishing support
        run: npm install --global npm@11.19.0

      - uses: actions/download-artifact@v4
        with:
          name: npm-packages
          path: ${{ runner.temp }}/npm-packages

      # Core goes first. On a partial-release retry, leave published versions
      # intact and continue with the remaining packages.
      - name: Publish npm packages with OIDC
        run: |
          for package in shared node browser; do
            name=$(node -p "require('./packages/${package}/package.json').name")
            version=$(node -p "require('./packages/${package}/package.json').version")
            if npm view "${name}@${version}" version --registry https://registry.npmjs.org >/dev/null 2>&1; then
              echo "${name}@${version} is already published; skipping"
              continue
            fi
            npm publish "${RUNNER_TEMP}/npm-packages/${package}.tgz" --access public --provenance --registry https://registry.npmjs.org
          done

  crates-io:
    name: Publish Rust crate
    needs: validate
    if: ${{ vars.PUBLISH_CRATE == 'true' }}
    runs-on: ubuntu-latest
    environment: crates-io
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish iroh-http
        run: cargo publish --package iroh-http
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
