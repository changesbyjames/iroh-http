[package]
name = "iroh-http"
description = "HTTP messages over Iroh QUIC connections, using http and tower types."
keywords = ["http", "iroh", "quic", "tower"]
categories = ["network-programming", "web-programming::http-server"]
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
bytes.workspace = true
http.workspace = true
http-body.workspace = true
http-body-util.workspace = true
iroh = { workspace = true, features = ["tls-ring", "portmapper"] }
n0-future.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tower = { workspace = true, features = ["util"] }

[dev-dependencies]
iroh-tickets.workspace = true
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
tower = { workspace = true, features = ["limit", "util"] }

[lints.rust]
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
